<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>N.U. Android Apps</title>
</head>
<body>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // 1. SE RECEBER ?code= (CONVERTE PARA BASE64 E ABRE O LINK DO GITHUB)
        const linkViaParametro = urlParams.get('code');
        if (linkViaParametro) {
            try {
                const codigoBase64 = btoa(unescape(encodeURIComponent(linkViaParametro)));
                const linkFinal = "https://nbc-nu.github.io/N.U.-Android-Apps/app-executer?c=" + codigoBase64;
                
                // Usando atribuição direta para que o navegador reconheça o escopo do PWA
                window.location.href = linkFinal;
            } catch (e) {
                console.error("Erro ao processar.");
            }
            return;
        }

        // 2. SE RECEBER ?c= (DECODIFICA O LINK REAL E ABRE O PWA)
        const base64Code = urlParams.get('c');
        if (base64Code) {
            try {
                const linkOriginal = atob(base64Code);
                
                // Redireciona diretamente na janela atual para ativar o app/PWA instalado
                window.location.href = linkOriginal;
            } catch (erro) {
                console.error("Erro ao decodificar.");
            }
        }
    })();
</script>

</body>
</html>

<!DOCTYPE html>
<head>
    <meta charset="UTF-8">
    <title>N.U. Android Apps Launcher</title>
</head>
<body>

<script>
    (function() {
        const urlParams = new URLSearchParams(window.location.search);
        
        // 1. SE RECEBER ?code= (CONVERTE PARA BASE64 E ABRE EM NOVA ABA)
        const linkViaParametro = urlParams.get('code');
        if (linkViaParametro) {
            try {
                // Transforma o link em Base64
                const codigoBase64 = btoa(unescape(encodeURIComponent(linkViaParametro)));
                
                // Monta o link final do GitHub com o parâmetro ?c=
                const linkFinal = "https://nbc-nu.github.io/N.U.-Android-Apps/app-executer?c=" + codigoBase64;
                
                // Abre o link final gerado imediatamente em uma nova aba
                window.open(linkFinal, '_blank');
            } catch (e) {
                console.error("Error while processing.");
            }
            return;
        }

        // 2. SE RECEBER ?c= (DECODIFICA O LINK REAL E ABRE EM NOVA ABA)
        const base64Code = urlParams.get('c');
        if (base64Code) {
            try {
                const linkOriginal = atob(base64Code);
                window.open(linkOriginal, '_blank');
            } catch (erro) {
                console.error("Error while encoding.");
            }
        }
    })();
</script>

</body>
</html>
